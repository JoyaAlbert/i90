[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i90-ingest"
version = "0.3.0"
description = "Daily REE/eSIOS I90DIA ingestion and structural market mapping"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.1,<3",
  "pdfplumber>=0.11,<1",
  "playwright>=1.55,<2",
]

[project.scripts]
i90-ingest = "i90_ingest.cli:main"
i90-structural = "i90_ingest.structural_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
